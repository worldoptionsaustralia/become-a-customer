<!DOCTYPE html>

<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thank You | World Options Australia</title>
<meta content="Thank you for contacting World Options Australia. Your enquiry has been received and our team will be in touch shortly." name="description"/>
<meta content="noindex, nofollow" name="robots"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }

:root {
  --ink:        #1D1D31;
  --off-white:  #F9F9F9;
  --white:      #FFFFFF;
  --navy:       #232E3C;
  --pink:       #E62864;
  --yellow:     #FFCE00;
  --blue:       #2295C3;
  --blue-light: #B9DDFC;
  --text-primary:   #1D1D31;
  --text-secondary: #4A5060;
  --text-muted:     #7A7D90;
  --border:     rgba(29,29,49,0.1);
  --font: 'Space Grotesk', 'Segoe UI', sans-serif;
  --radius-sm: 3px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --radius-xl: 20px;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  color: var(--text-primary);
  background: var(--off-white);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.accent-bar {
  height: 4px;
  background: linear-gradient(90deg, var(--pink) 0%, var(--yellow) 55%, var(--blue) 100%);
}

.top-bar {
  padding: 20px 24px;
  display: flex;
  justify-content: center;
  border-bottom: 1px solid var(--border);
}
.top-bar img { height: 36px; display: block; }

.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}

.card {
  max-width: 560px;
  width: 100%;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 48px 40px;
  text-align: center;
}

.check-badge {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(230,40,100,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
}
.check-badge svg { width: 30px; height: 30px; }

h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 12px;
}
h1 .accent { color: var(--pink); }

.subtext {
  color: var(--text-secondary);
  font-size: 15.5px;
  margin-bottom: 32px;
}

.next-steps {
  text-align: left;
  background: var(--off-white);
  border-radius: var(--radius-md);
  padding: 20px 22px;
  margin-bottom: 32px;
}
.next-steps h2 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.next-steps ul { list-style: none; }
.next-steps li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14.5px;
  color: var(--text-primary);
  margin-bottom: 10px;
}
.next-steps li:last-child { margin-bottom: 0; }
.next-steps li::before {
  content: '';
  flex-shrink: 0;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--pink);
  margin-top: 7px;
}

.shipping-message {
  text-align: center;
  background: rgba(255,206,0,0.16);
  border: 1px solid rgba(255,206,0,0.45);
}
.shipping-message p {
  color: var(--ink);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.1px;
}

.contact {
  border-top: 1px solid var(--border);
  padding-top: 24px;
  font-size: 14px;
  color: var(--text-secondary);
}
.contact strong { color: var(--text-primary); }
.contact a { color: var(--blue); text-decoration: none; }
.contact a:hover { text-decoration: underline; }
.contact-row { margin-bottom: 6px; }
.contact-row:last-child { margin-bottom: 0; }

footer {
  text-align: center;
  padding: 24px;
  font-size: 12.5px;
  color: var(--text-muted);
}
footer a { color: var(--text-muted); }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="top-bar">
<img alt="World Options Australia" onerror="this.style.display='none'" src="https://worldoptionsaustralia.github.io/franchise-opportunity/assets/world-options-logo.png"/>
</div>
<main class="main">
<div class="card">
<div class="check-badge">
<svg fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20 6L9 17l-5-5" stroke="#E62864" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<h1 id="greeting">Thank You</h1>
<p class="subtext">Your enquiry has been received. A member of the World Options Australia team will be in touch shortly.</p>
<div class="next-steps shipping-message">
<p>Happy Shipping.</p>
</div>
<div class="contact">
<div class="contact-row"><strong>World Options Australia</strong></div>
</div>
</div>
</main>
<footer>
  © <span id="yr"></span> World Options Australia. All rights reserved.
</footer>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  // Personalize greeting from ?name= URL parameter
  (function() {
    var params = new URLSearchParams(window.location.search);
    var name = params.get('name');
    if (name && name.trim()) {
      var safe = name.trim().split(' ')[0]; // first name only, in case full name was passed
      safe = safe.replace(/[<>]/g, ''); // basic sanitisation
      document.getElementById('greeting').innerHTML = 'Thank You, ' + safe + '<span class="accent">.</span>';
    }
  })();
</script>



</body>
</html>
